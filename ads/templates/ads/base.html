{% load static %}
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}마을 광고 스튜디오{% endblock %}</title>
<link rel="stylesheet" href="{% static 'ads/advertiser.css' %}">
<script src="{% static 'ads/advertiser.js' %}" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="{% url 'ads:campaigns' %}"><span class="brand-icon">✦</span> 마을 광고 스튜디오</a>
{% if user.is_authenticated %}<nav><a href="{% url 'ads:campaigns' %}">캠페인</a><a href="{% url 'ads:bids' %}">입찰 관리</a><a href="{% url 'ads:web-events' %}">선택·실적</a><span class="account">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet">로그아웃</button></form></nav>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
<footer>작은 마을에 전하는 광고 · 선택 기록과 실제 노출은 구분합니다.</footer>
</body></html>
